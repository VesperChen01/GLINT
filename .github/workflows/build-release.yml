name: Build & Release (DMG + EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

jobs:
  # ============================================================
  # Job 1: macOS → DMG
  # ============================================================
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build DMG
        run: |
          chmod +x release_glint.sh
          ./release_glint.sh ${{ steps.ver.outputs.version }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLINT-DMG
          path: GLINT_Installer_${{ steps.ver.outputs.version }}.dmg
          retention-days: 30

  # ============================================================
  # Job 2: Windows → EXE  (reuses logic from build-windows-exe.yml)
  # ============================================================
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install pyinstaller Pillow --quiet

      - name: Build EXE with PowerShell script
        shell: pwsh
        working-directory: windows_installer
        run: |
          powershell -ExecutionPolicy Bypass -File build_exe.ps1



      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLINT-EXE
          path: windows_installer/dist/GLINT_Installer.exe
          retention-days: 30

  # ============================================================
  # Job 3: Publish GitHub Release
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-dmg, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: GLINT-DMG
          path: dist/

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: GLINT-EXE
          path: dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "GLINT ${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
