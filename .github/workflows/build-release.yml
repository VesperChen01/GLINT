name: Build & Release (DMG + EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.5)'
        required: true
        default: 'v0.2.5'

jobs:
  # ============================================================
  # Job 1: macOS → DMG
  # ============================================================
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build DMG
        run: |
          chmod +x release_glint.sh
          ./release_glint.sh ${{ steps.ver.outputs.version }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLINT-DMG
          path: GLINT_Installer_${{ steps.ver.outputs.version }}.dmg
          retention-days: 30

  # ============================================================
  # Job 2: Windows → EXE  (reuses logic from build-windows-exe.yml)
  # ============================================================
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install pyinstaller Pillow --quiet

      - name: Copy glint source into windows_installer
        shell: pwsh
        run: |
          if (Test-Path "windows_installer\glint") {
            Remove-Item -Path "windows_installer\glint" -Recurse -Force
          }
          Copy-Item -Path "glint" -Destination "windows_installer\glint" -Recurse -Force
          Get-ChildItem -Path "windows_installer\glint" -Directory -Recurse -Filter "__pycache__" |
            Remove-Item -Recurse -Force

      - name: Generate logo.ico
        shell: pwsh
        run: |
          python -c "
          from PIL import Image
          img = Image.open('windows_installer/glint/assets/logo.png').convert('RGBA')
          img.save('windows_installer/glint/assets/logo.ico', format='ICO',
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('logo.ico generated')
          "

      - name: Build EXE with PyInstaller
        working-directory: windows_installer
        run: pyinstaller --noconfirm GLINT_Installer.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLINT-EXE
          path: windows_installer/dist/GLINT_Installer.exe
          retention-days: 30

  # ============================================================
  # Job 3: Publish GitHub Release
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-dmg, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: GLINT-DMG
          path: dist/

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: GLINT-EXE
          path: dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "GLINT ${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe

