name: Build Windows Installer EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows_installer/**'
      - 'glint/**'

jobs:
  build:
    runs-on: windows-latest
    name: Build GLINT_Installer.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow

      - name: Copy glint source into windows_installer
        run: |
          if (Test-Path "windows_installer\glint") {
            Remove-Item -Path "windows_installer\glint" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "windows_installer\glint" | Out-Null
          Copy-Item -Path "glint\*" -Destination "windows_installer\glint" -Recurse -Force
        shell: pwsh

      - name: Clean __pycache__ directories
        run: |
          Get-ChildItem -Path "windows_installer\glint" -Directory -Recurse -Filter "__pycache__" |
            Remove-Item -Recurse -Force
        shell: pwsh

      - name: Generate logo.ico from logo.png
        run: |
          python -c "from PIL import Image; p_in=r'windows_installer/glint/assets/logo.png'; p_out=r'windows_installer/glint/assets/logo.ico'; img=Image.open(p_in).convert('RGBA'); w,h=img.size; target=256; min_side=min(w,h); resized=min_side<target; scale=(target/min_side) if resized else 1; new_w=int(round(w*scale)); new_h=int(round(h*scale)); img=img.resize((new_w,new_h), Image.LANCZOS) if resized else img; print(f'logo.png original size: {w}x{h}'); print(f'logo.png final size: {img.size[0]}x{img.size[1]} (resized={resized})'); img.save(p_out, format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]); print('logo.ico generated successfully')"
        shell: pwsh

      - name: Build EXE with PyInstaller
        working-directory: windows_installer
        run: |
          pyinstaller --noconfirm GLINT_Installer.spec

      - name: Verify output
        run: |
          if (Test-Path "windows_installer\dist\GLINT_Installer.exe") {
            $size = (Get-Item "windows_installer\dist\GLINT_Installer.exe").Length / 1MB
            Write-Host "Build successful! EXE size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "GLINT_Installer.exe not found in dist/"
            exit 1
          }
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLINT_Installer
          path: windows_installer/dist/GLINT_Installer.exe
          retention-days: 30
          if-no-files-found: error