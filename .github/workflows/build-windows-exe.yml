name: Build Windows Installer EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows_installer/**'
      - 'glint/**'

jobs:
  build:
    runs-on: windows-latest
    name: Build GLINT_Installer.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow

      - name: Build EXE with PowerShell script
        shell: pwsh
        working-directory: windows_installer
        run: |
          powershell -ExecutionPolicy Bypass -File build_exe.ps1

      - name: Verify output
        shell: pwsh
        run: |
          if (Test-Path "windows_installer\dist\GLINT_Installer.exe") {
            $size = (Get-Item "windows_installer\dist\GLINT_Installer.exe").Length / 1MB
            Write-Host "Build successful! EXE size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "GLINT_Installer.exe not found in dist/"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLINT_Installer
          path: windows_installer/dist/GLINT_Installer.exe
          retention-days: 30
          if-no-files-found: error

