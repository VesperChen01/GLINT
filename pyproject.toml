[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gluetk"
version = "0.1.24-beta"
description = "GlueTK - Molecular Glue Analyzer for PyMOL"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Vesper"}
]
keywords = ["pymol", "molecular-glue", "drug-discovery", "docking", "protein"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.23,<2",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "networkx>=2.8",
    "biopython>=1.79",
    "scikit-image>=0.19,<0.22",
]

[project.optional-dependencies]
full = [
    "openbabel",
    "rdkit",
    "prody",
    "haddock3",
]

[project.urls]
Homepage = "https://github.com/vesper/GlueTK"
Repository = "https://github.com/vesper/GlueTK"

[tool.setuptools]
packages = ["gluetk", "gluetk.gui", "gluetk.gui.tabs"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
gluetk = ["assets/*", "data/*"]
