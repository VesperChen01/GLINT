# GLINT Documentation Configuration

title: GLINT - PyMOL Plugin for Molecular Glue Discovery
description: Comprehensive PyMOL plugin for molecular glue discovery and analysis
theme: minima
markdown: kramdown
highlighter: rouge
url: "https://vesperchen01.github.io/GLINT"
baseurl: "/GLINT"

# Navigation
nav:
  - title: Home
    url: /
  - title: Installation
    url: /installation
  - title: Tutorial
    url: /tutorial
  - title: API Reference
    url: /api

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.docx"
